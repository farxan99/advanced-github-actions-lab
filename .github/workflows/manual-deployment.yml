name: Manual Deployment Simulation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment target
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  staging:
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulated staging deployment"

  production:
    if: inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Simulated production deployment"
